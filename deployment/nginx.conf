# Incluir dentro del bloque http {} de nginx.conf.
# Sólo cloudflared local puede llegar a este listener.
limit_req_zone $binary_remote_addr zone=agenda_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=agenda_auth:10m rate=5r/m;
limit_req_status 429;

upstream agenda_api { server 127.0.0.1:3001; keepalive 16; }
upstream agenda_web { server 127.0.0.1:3000; keepalive 8; }

server {
    listen 127.0.0.1:8080;
    server_name reservas.example.com;
    server_tokens off;
    client_max_body_size 6m;
    error_page 429 = @agenda_rate_limit;

    # El único peer permitido es cloudflared en el mismo servidor.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location @agenda_rate_limit {
        default_type application/problem+json;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"type":"about:blank","title":"Demasiadas solicitudes","status":429,"code":"RATE_LIMITED","detail":"Espera un minuto e intenta nuevamente.","requestId":"$request_id"}';
    }

    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=agenda_auth burst=5 nodelay;
        proxy_pass http://agenda_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=agenda_api burst=30 nodelay;
        proxy_pass http://agenda_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_cache off;
    }

    # The v1 does not use Next Image Optimization (Next 14 security mitigation).
    location ^~ /_next/image { return 404; }

    location = /health { return 404; }
    location = /ready { return 404; }
    location ~ ^/docs { return 404; }
    location ~ /\. { deny all; }

    location / {
        proxy_pass http://agenda_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
