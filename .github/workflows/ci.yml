name: Calidad
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: reservas_test
          MYSQL_USER: reservas
          MYSQL_PASSWORD: ci-only-not-production
          MYSQL_ROOT_PASSWORD: ci-root-only-not-production
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      EXPO_NO_TELEMETRY: '1'
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: mysql://reservas:ci-only-not-production@127.0.0.1:3306/reservas_test
      BUSINESS_ID: 11111111-1111-4111-8111-111111111111
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      WEB_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: CI-test-password-2026-Only!
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm --filter @reservas/web exec playwright install --with-deps chromium
      - name: Iniciar servicios de prueba
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1) &
          (cd apps/web && pnpm start > /tmp/web.log 2>&1) &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/ready && curl -fsS http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - run: pnpm test:e2e
