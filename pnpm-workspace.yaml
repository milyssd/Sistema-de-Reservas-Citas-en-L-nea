verifyDepsBeforeRun: error
packages:
  - apps/*
  - packages/*
allowBuilds:
  '@scarf/scarf': false # Optional Swagger dependency telemetry is not needed.
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true

# Security fixes for compatible transitive dependency lines. Keep versions explicit
# so a frozen installation reproduces the audited dependency graph.
overrides:
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'mariadb@>=3.4.0 <3.5.4': 3.5.4
  'lodash@>=4.0.0 <4.18.1': 4.18.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'js-yaml@>=5.0.0 <5.5.0': 5.5.0
  'body-parser@>=1.0.0 <1.20.9': 1.20.9
  'qs@>=6.0.0 <6.16.1': 6.16.1
  'effect@>=3.0.0 <3.20.0': 3.20.0
  'postcss@>=8.0.0 <8.5.31': 8.5.31
  '@prisma/config@6.19.0>deepmerge-ts': 8.0.2
  '@expo/cli@58.1.15>zod': 4.6.7

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
